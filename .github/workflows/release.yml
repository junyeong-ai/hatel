name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  # Gate the release on the same checks as CI — on every OS CI tests — so a tag pushed on a bad
  # commit can't publish artifacts that `main`/PR CI would have rejected.
  test:
    name: Test gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - run: cargo test --workspace --locked
      - run: cargo clippy --all-targets --all-features --workspace --locked -- -D warnings

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every target builds natively on its own runner (Linux arm64 included), so the
      # binaries carry the current runner images' baselines — supporting recent distros
      # only is the explicit policy.
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
          cache: false

      # Release jobs build cold on purpose: restoring a cache into the jobs that produce
      # (or gate) shipped artifacts would let a poisoned cache entry reach a release.
      # musl links through its own C toolchain (the C-bundled SQLite in `core` compiles
      # with it), installed here and named via CC below so the glibc gcc is never
      # silently substituted.
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build release binaries
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          [[ "$MATRIX_TARGET" == *-musl ]] && export CC=musl-gcc
          cargo build --release --locked --target "$MATRIX_TARGET" \
            --bin hatel --bin hatel-hook

      # One self-contained archive per target: both binaries (receiver + hook) and the Claude
      # Code skill, so the installer downloads once and gets the whole product, version-locked.
      # The name is unversioned: the pinned download URL carries the version in its path
      # (`/releases/download/vX/...`) and `latest` uses `/releases/latest/download/...`, so one
      # name serves both with no alias mirroring and no version-detection in the installer.
      - name: Package
        id: package
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          target="$MATRIX_TARGET"
          stem="hatel-${target}"
          mkdir -p staging/skill
          cp .claude/skills/hatel/SKILL.md staging/skill/SKILL.md
          if [ "$MATRIX_OS" = "windows-latest" ]; then
            cp "target/${target}/release/hatel.exe" staging/
            cp "target/${target}/release/hatel-hook.exe" staging/
            archive="${stem}.zip"
            (cd staging && 7z a "../${archive}" hatel.exe hatel-hook.exe skill >/dev/null)
          else
            cp "target/${target}/release/hatel" staging/
            cp "target/${target}/release/hatel-hook" staging/
            archive="${stem}.tar.gz"
            tar -C staging -czf "${archive}" hatel hatel-hook skill
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "checksum=${archive}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the provenance attestation: the OIDC identity that signs it, and the
      # attestation store it is written to.
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      # SLSA build provenance for every shipped archive, verifiable by consumers with
      # `gh attestation verify <archive> --repo junyeong-ai/hatel`. Subjects are the
      # archives only — the .sha256 sidecars are derived from them, not artifacts in
      # their own right.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      # The runner-bundled `gh` publishes the release directly — no third-party action in
      # the one job that holds a write token. An unmatched `dist/*` expands to nothing
      # matched — the literal path — and gh errors on it, so an empty dist can never
      # publish an empty release. A re-run after a partial publish uploads into the
      # existing release rather than failing on it.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes
          fi
