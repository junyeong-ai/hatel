# Built-in, domain-agnostic telemetry schema. Plugins merge additional `[[kind]]`
# and `[[binding]]` tables through the same loader (see schema.rs). Every field a
# binding can write is present in the matching hook's documented stdin, or is the
# `git_branch` the hook reads from the session's working tree — no field is ever
# fabricated.

# Native OpenTelemetry signals the receiver folds (metrics) and counts (events).
# Only metrics the live view surfaces are tracked — adding one here without a
# matching view column would decode and retain series that nothing ever reads.
tracked_metrics = [
    "claude_code.token.usage",
    "claude_code.cost.usage",
    "claude_code.active_time.total",
    "claude_code.lines_of_code.count",
]
counted_events = [
    "claude_code.user_prompt",
    "claude_code.tool_decision",
    "claude_code.skill_activated",
]

# ── Kinds ──

# One record per tool call that returned, keyed on the call's own `tool_use_id`. `agent_id` is
# present only when a subagent made the call, so its absence names the main agent — the dimension
# a session-level tool count flattens away. `duration_ms` is time until the call returned: a
# backgrounded command returns as soon as it is accepted, so its figure is acceptance, not work.
# `skill` names the skill a `Skill` call asked for, a failed call included: a skill the model
# invokes on its own expands no command, so this is the only record of which one it was. Every
# other tool's input is content and stays out.
[[kind]]
name = "tool"
fields = { session_id = { type = "string" }, project = { type = "string" }, prompt_id = { type = "string" }, agent_id = { type = "string" }, tool_name = { type = "string" }, tool_use_id = { type = "string" }, duration_ms = { type = "number", unit = "ms" }, ok = { type = "integer" }, skill = { type = "string" } }
group_key = "tool_name"
identity = "tool_use_id"
measures = ["duration_ms", "ok"]

[[kind]]
name = "prompt"
fields = { session_id = { type = "string" }, project = { type = "string" }, prompt_id = { type = "string" }, prompt_len = { type = "integer" } }
group_key = "session_id"

# One record per instruction file entering context. `file_path` is the file as its repository names
# it, so a nested `CLAUDE.md` and the root one stay apart, and `project` separates the same path in
# two repositories. Rebuilding context (`session_start`, `compact`) announces every file again, an
# @-imported one as `include` with `parent_file_path`. A load a file access set off carries
# `trigger_file_path` and skips a file the context already holds — read directly, or loaded since
# the last compaction — so an absent load does not mean an absent file. `prompt_id` is the latest
# prompt submitted when the load happened.
[[kind]]
name = "memory"
fields = { session_id = { type = "string" }, project = { type = "string" }, prompt_id = { type = "string" }, file_path = { type = "string" }, memory_type = { type = "string" }, load_reason = { type = "string" }, trigger_file_path = { type = "string" }, parent_file_path = { type = "string" } }
group_key = "file_path"

[[kind]]
name = "subagent"
fields = { session_id = { type = "string" }, project = { type = "string" }, prompt_id = { type = "string" }, agent_id = { type = "string" }, agent = { type = "string" } }
group_key = "agent"
identity = "agent_id"

# One record per session start. A session starts more than once: `resume`, `fork`, `clear` and
# `compact` each fire `SessionStart` again on an existing conversation, so the record counts starts
# rather than sessions and carries no identity — a start has no identifier of its own. `source`
# names what began it, and `branch` the branch its working tree had checked out, absent on a
# detached HEAD. A session's native cost rows give a branch's spend only as whole-session totals,
# and a switch inside a session shows only at its next start. Resume/fork can carry the estimated cost of writing the next
# request's context to the cache; this is a forecast, not an amount to add to native-OTel spend.
[[kind]]
name = "session"
fields = { session_id = { type = "string" }, project = { type = "string" }, source = { type = "string" }, branch = { type = "string" }, context_tokens = { type = "integer" }, since_last_response_s = { type = "number", unit = "s" }, estimated_cache_write_usd = { type = "number", unit = "USD" }, cache_likely_expired = { type = "boolean" } }
group_key = "source"
measures = ["estimated_cache_write_usd", "context_tokens"]

# Explicit slash-command and skill invocations, one record per expansion. The name is the whole
# signal: the arguments and the expanded prompt are the operator's own text and stay out of the
# ledger. A skill the model loads on its own expands nothing and is not counted here.
[[kind]]
name = "command"
fields = { session_id = { type = "string" }, project = { type = "string" }, prompt_id = { type = "string" }, command_name = { type = "string" } }
group_key = "command_name"

[[kind]]
name = "compaction"
fields = { session_id = { type = "string" }, project = { type = "string" }, prompt_id = { type = "string" }, trigger = { type = "string" } }
group_key = "session_id"

[[kind]]
name = "check"
fields = { name = { type = "string", required = true }, suite = { type = "string" }, outcome = { type = "string", required = true }, duration_s = { type = "number", unit = "s" }, exit_code = { type = "integer" }, signal = { type = "string" } }
group_key = "name"
measures = ["duration_s"]

[[kind]]
name = "claude.api_request"
fields = { session_id = { type = "string", required = true }, request_id = { type = "string" }, model = { type = "string" }, agent = { type = "string" }, skill = { type = "string" }, query_source = { type = "string" }, cost_usd = { type = "number", unit = "USD" }, duration_ms = { type = "number", unit = "ms" }, input_tokens = { type = "integer", unit = "tokens" }, output_tokens = { type = "integer", unit = "tokens" }, cache_read_tokens = { type = "integer", unit = "tokens" }, cache_creation_tokens = { type = "integer", unit = "tokens" } }
group_key = "model"
identity = "request_id"
measures = ["cost_usd", "duration_ms", "input_tokens", "output_tokens", "cache_read_tokens", "cache_creation_tokens"]

[[kind]]
name = "claude.hook"
fields = { session_id = { type = "string", required = true }, hook_event = { type = "string" }, hook_name = { type = "string" }, num_hooks = { type = "integer" }, num_success = { type = "integer" }, num_blocking = { type = "integer" }, num_non_blocking_error = { type = "integer" }, num_cancelled = { type = "integer" }, duration_ms = { type = "number", unit = "ms" } }
group_key = "hook_name"
measures = ["duration_ms", "num_hooks", "num_success", "num_blocking", "num_non_blocking_error", "num_cancelled"]

# Native-OTel cost/tokens are a snapshot, not a hook event — they live in a
# rewritten snapshot file (see cost.rs), not as a Kind in the ledger.

# ── Hook bindings (event → kind, with declarative field maps) ──
# `project` is injected by the hook from the cwd; it is never mapped here. `prompt_id` names the
# turn an event belongs to, so one request's tool calls, subagents, memory loads and compactions
# group together under `--group-by prompt_id`. An event raised before any prompt carries none and
# is not given one.

# A returning tool call fires exactly one of these two, so the pair writes one record per call and
# `ok` distinguishes them. A call blocked before it ran fires neither — `PreToolUse` alone marks
# that, and binding it would file an attempt as a call.
[[binding]]
event = "PostToolUse"
kind = "tool"
map.session_id = { from = "session_id" }
map.prompt_id = { from = "prompt_id" }
map.agent_id = { from = "agent_id" }
map.tool_name = { from = "tool_name" }
map.tool_use_id = { from = "tool_use_id" }
map.duration_ms = { from = "duration_ms" }
map.ok = { const = 1 }
map.skill = { from = "/tool_input/skill", when = { tool_name = "Skill" } }

[[binding]]
event = "PostToolUseFailure"
kind = "tool"
map.session_id = { from = "session_id" }
map.prompt_id = { from = "prompt_id" }
map.agent_id = { from = "agent_id" }
map.tool_name = { from = "tool_name" }
map.tool_use_id = { from = "tool_use_id" }
map.duration_ms = { from = "duration_ms" }
map.ok = { const = 0 }
map.skill = { from = "/tool_input/skill", when = { tool_name = "Skill" } }

# A fresh start carries `source` alone; the cost fields accompany a resumed or forked one, so a
# fresh start contributes zero to the sums rather than a guessed value.
[[binding]]
event = "SessionStart"
kind = "session"
map.session_id = { from = "session_id" }
map.source = { from = "source" }
map.branch = { from = "git_branch" }
map.context_tokens = { from = "context_tokens" }
map.since_last_response_s = { from = "seconds_since_last_response" }
map.estimated_cache_write_usd = { from = "estimated_cache_write_usd" }
map.cache_likely_expired = { from = "prompt_cache_likely_expired" }

[[binding]]
event = "UserPromptSubmit"
kind = "prompt"
map.session_id = { from = "session_id" }
map.prompt_id = { from = "prompt_id" }
map.prompt_len = { from = "prompt", len = true }

[[binding]]
event = "InstructionsLoaded"
kind = "memory"
map.session_id = { from = "session_id" }
map.prompt_id = { from = "prompt_id" }
map.file_path = { from = "file_path", repo_path = true }
map.memory_type = { from = "memory_type" }
map.load_reason = { from = "load_reason" }
map.trigger_file_path = { from = "trigger_file_path", repo_path = true }
map.parent_file_path = { from = "parent_file_path", repo_path = true }

# SubagentStop fires at every turn boundary, so an agent resumed with a message stops more than
# once; `agent_id` is stable across those, which is what makes the spawn — not the turn — the unit
# a report counts. `agent` is the label the event carries: the declared type for a plain subagent,
# the operator's name for a teammate (Claude Code puts the name in that field and exposes the
# declared type nowhere a hook can read), so it is recorded as the label it is rather than
# asserted to be a type. A missing `agent_type` stays absent rather than implying a particular
# agent implementation. An empty `agent_type` stays an empty string; Claude Code's internal agents
# (prompt suggestion, `/btw`) stop with the session's agent name or an empty string, so neither
# an empty nor a named label alone isolates spawned subagents.
[[binding]]
event = "SubagentStop"
kind = "subagent"
map.session_id = { from = "session_id" }
map.prompt_id = { from = "prompt_id" }
map.agent_id = { from = "agent_id" }
map.agent = { from = "agent_type" }

[[binding]]
event = "UserPromptExpansion"
kind = "command"
map.session_id = { from = "session_id" }
map.prompt_id = { from = "prompt_id" }
map.command_name = { from = "command_name" }

# One compaction fires both PreCompact and PostCompact, so only one is bound — one
# record per compaction. PreCompact is chosen because it always fires (a compaction
# that is interrupted may never reach PostCompact). The trigger key name is not fixed
# in the docs, so both known spellings are tried.
[[binding]]
event = "PreCompact"
kind = "compaction"
map.session_id = { from = "session_id" }
map.prompt_id = { from = "prompt_id" }
map.trigger = { from = ["trigger", "compact_trigger"] }
