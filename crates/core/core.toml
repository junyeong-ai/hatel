# Built-in, domain-agnostic telemetry schema. Plugins merge additional `[[kind]]`
# and `[[binding]]` tables through the same loader (see schema.rs). Every field a
# binding can write is present in the matching hook's documented stdin — no field
# is ever fabricated.

# Native OpenTelemetry signals the receiver folds (metrics) and counts (events).
# Only metrics the live view surfaces are tracked — adding one here without a
# matching view column would decode and retain series that nothing ever reads.
tracked_metrics = [
    "claude_code.token.usage",
    "claude_code.cost.usage",
    "claude_code.active_time.total",
    "claude_code.lines_of_code.count",
]
counted_events = [
    "claude_code.user_prompt",
    "claude_code.tool_decision",
    "claude_code.skill_activated",
]

# ── Kinds ──

# One record per tool call that returned, keyed on the call's own `tool_use_id`. `agent_id` is
# present only when a subagent made the call, so its absence names the main agent — the dimension
# a session-level tool count flattens away. `duration_ms` is time until the call returned: a
# backgrounded command returns as soon as it is accepted, so its figure is acceptance, not work.
[[kind]]
name = "tool"
fields = ["session_id", "project", "prompt_id", "agent_id", "tool_name", "tool_use_id", "duration_ms", "ok"]
group_key = "tool_name"
identity = "tool_use_id"
measures = ["duration_ms", "ok"]

[[kind]]
name = "prompt"
fields = ["session_id", "project", "prompt_len"]
group_key = "session_id"

[[kind]]
name = "memory"
fields = ["session_id", "project", "memory_id", "memory_type", "load_reason"]
group_key = "memory_id"

[[kind]]
name = "subagent"
fields = ["session_id", "project", "agent_id", "agent"]
group_key = "agent"
identity = "agent_id"

# One record per session start. A session starts more than once — `/resume` and `/fork` on an
# existing conversation each fire `SessionStart` again — so the record counts starts, not sessions,
# and carries no identity: a start has no identifier of its own. `source` names what began it, and
# for a resumed start Claude Code computes what re-establishing the prompt cache costs, which is
# the spend a session-level total never shows.
[[kind]]
name = "session"
fields = ["session_id", "project", "source", "context_tokens", "since_last_response_s", "estimated_cache_write_usd", "cache_likely_expired"]
group_key = "source"
measures = ["estimated_cache_write_usd", "context_tokens", "since_last_response_s"]

[[kind]]
name = "compaction"
fields = ["session_id", "project", "trigger"]
group_key = "session_id"

# Native-OTel cost/tokens are a snapshot, not a hook event — they live in a
# rewritten snapshot file (see cost.rs), not as a Kind in the append-only sink.

# ── Hook bindings (event → kind, with declarative field maps) ──
# `project` is injected by the hook from the cwd; it is never mapped here.

# A returning tool call fires exactly one of these two, so the pair writes one record per call and
# `ok` distinguishes them. A call blocked before it ran fires neither — `PreToolUse` alone marks
# that, and binding it would file an attempt as a call.
[[binding]]
event = "PostToolUse"
kind = "tool"
map.session_id = { from = "session_id" }
map.prompt_id = { from = "prompt_id" }
map.agent_id = { from = "agent_id" }
map.tool_name = { from = "tool_name" }
map.tool_use_id = { from = "tool_use_id" }
map.duration_ms = { from = "duration_ms" }
map.ok = { const = 1 }

[[binding]]
event = "PostToolUseFailure"
kind = "tool"
map.session_id = { from = "session_id" }
map.prompt_id = { from = "prompt_id" }
map.agent_id = { from = "agent_id" }
map.tool_name = { from = "tool_name" }
map.tool_use_id = { from = "tool_use_id" }
map.duration_ms = { from = "duration_ms" }
map.ok = { const = 0 }

# A fresh start carries `source` alone; the cost fields accompany a resumed or forked one, so a
# fresh start contributes zero to the sums rather than a guessed value.
[[binding]]
event = "SessionStart"
kind = "session"
map.session_id = { from = "session_id" }
map.source = { from = "source" }
map.context_tokens = { from = "context_tokens" }
map.since_last_response_s = { from = "seconds_since_last_response" }
map.estimated_cache_write_usd = { from = "estimated_cache_write_usd" }
map.cache_likely_expired = { from = "prompt_cache_likely_expired" }

[[binding]]
event = "UserPromptSubmit"
kind = "prompt"
map.session_id = { from = "session_id" }
map.prompt_len = { from = "prompt", len = true }

[[binding]]
event = "InstructionsLoaded"
kind = "memory"
map.session_id = { from = "session_id" }
map.memory_id = { from = "file_path", basename = true }
map.memory_type = { from = "memory_type" }
map.load_reason = { from = "load_reason" }

# SubagentStop fires at every turn boundary, so an agent resumed with a message stops more than
# once; `agent_id` is stable across those, which is what makes the spawn — not the turn — the unit
# a report counts. `agent` is the label the event carries: the declared type for a plain subagent,
# the operator's name for a teammate (Claude Code puts the name in that field and exposes the
# declared type nowhere a hook can read), so it is recorded as the label it is rather than
# asserted to be a type.
[[binding]]
event = "SubagentStop"
kind = "subagent"
map.session_id = { from = "session_id" }
map.agent_id = { from = "agent_id" }
map.agent = { from = "agent_type" }

# One compaction fires both PreCompact and PostCompact, so only one is bound — one
# record per compaction. PreCompact is chosen because it always fires (a compaction
# that is interrupted may never reach PostCompact). The trigger key name is not fixed
# in the docs, so both known spellings are tried.
[[binding]]
event = "PreCompact"
kind = "compaction"
map.session_id = { from = "session_id" }
map.trigger = { from = ["trigger", "compact_trigger"] }
